spring:
  application:
    name: member-service
  datasource:
    # 실제 접속 정보는 배포 환경에서 환경변수로 주입한다 (k8s: member.yaml / 로컬: docker-compose.yml)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/logindockerdb}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

server:
  port: 8081

# auth-service와 반드시 동일한 값을 사용해야 발급된 토큰을 검증할 수 있음
jwt:
  secret: ${JWT_SECRET:local-dev-secret-key-change-me-please-32bytes}
  expiration: 1800000

 
# 모니터링 — Prometheus 가 /actuator/prometheus 로 지표를 수집해 간다
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
