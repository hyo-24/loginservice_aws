events { }

http {

    server {

     proxy_set_header Host               $host;
     proxy_set_header IP          $remote_addr;
     proxy_set_header Forwarded-IP    $proxy_add_x_forwarded_for;
     proxy_set_header Proto  $scheme;

     listen 80;

     location /auth {

     proxy_pass http://auth-service:8080;

     }

     location /internal {

        return 403;

     }

     location / {

     proxy_pass http://member-service:8081;

     }

    }

}
