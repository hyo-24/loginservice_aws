name: Deploy to EC2

on:
  push:
    branches: [ main ]
    # 문서만 고친 커밋에서는 이미지 빌드를 돌리지 않는다
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: auth-service 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: leehyoju24/login-service:latest

      - name: member-service 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./member-service
          push: true
          tags: leehyoju24/member-service:latest

  deploy:
    needs: build-and-push
    # EC2 인스턴스를 내린 상태라 기본적으로 실행하지 않는다(건너뜀 처리).
    # 다시 띄우면 저장소 Settings > Variables 에 DEPLOY_TO_EC2=true 를 추가하면 그대로 동작한다.
    if: vars.DEPLOY_TO_EC2 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH로 접속해 배포 실행
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            DB_PASSWORD=$(aws secretsmanager get-secret-value \
            --secret-id login-service/db-password \
            --query 'SecretString' \
            --output text | jq -r '.DB_PASSWORD')

            docker pull leehyoju24/login-service:latest
            docker pull leehyoju24/member-service:latest
            docker stop auth-service member-service || true
            docker rm auth-service member-service || true
            docker run -d --name auth-service -p 8080:8080 -e DB_PASSWORD=$DB_PASSWORD leehyoju24/login-service:latest
            docker run -d --name member-service -p 8081:8081 -e DB_PASSWORD=$DB_PASSWORD leehyoju24/member-service:latest
